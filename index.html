<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.classList.add(t);
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Thẻ Meta hỗ trợ SEO -->
    <meta name="description" content="Pham Son's Portfolio - Software & AI Engineer, chuyên phát triển hệ thống web hiện đại và tích hợp các mô hình AI tiên tiến.">
    <meta name="keywords" content="Pham Son's Portfolio, Phạm Sơn, Software Engineer, AI Engineer, Web Developer, Frontend Specialist, Fullstack, React, Next.js, FastAPI, Python, Vingroup VinUni">
    <meta name="author" content="Phạm Sơn">
    <meta name="robots" content="index, follow">
    <meta name="copyright" content="©2026 Phạm Sơn">
    <meta name="theme-color" content="#09090b">

    <!-- Cấu hình Open Graph (Facebook, Zalo) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Pham Son's Portfolio">
    <meta property="og:url" content="%VITE_SITE_URL%/">
    <meta property="og:title" content="Pham Son's Portfolio | Software & AI Engineer">
    <meta property="og:description" content="Pham Son's Portfolio - Software & AI Engineer, chuyên phát triển hệ thống web hiện đại và tích hợp các mô hình AI tiên tiến.">
    <meta property="og:image" content="%VITE_SITE_URL%/logo.ico">

    <!-- Cấu hình hiển thị khi chia sẻ trên Twitter/X -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="%VITE_SITE_URL%/">
    <meta property="twitter:title" content="Pham Son's Portfolio | Software & AI Engineer">
    <meta property="twitter:description" content="Pham Son's Portfolio - Software & AI Engineer, chuyên phát triển hệ thống web hiện đại và tích hợp các mô hình AI tiên tiến.">
    <meta property="twitter:image" content="%VITE_SITE_URL%/logo.ico">

    <!-- Thẻ liên kết canonical -->
    <link rel="canonical" href="%VITE_SITE_URL%/">
    <title>Pham Son's Portfolio</title>

    <!-- Dữ liệu cấu trúc Schema (JSON-LD) cho công cụ tìm kiếm -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "%VITE_SITE_URL%/#website",
            "url": "%VITE_SITE_URL%/",
            "name": "Phạm Sơn",
            "inLanguage": "vi-VN"
          },
          {
            "@type": "Person",
            "@id": "%VITE_SITE_URL%/#person",
            "name": "Phạm Sơn",
            "url": "%VITE_SITE_URL%/",
            "jobTitle": "Software & AI Engineer"
          }
        ]
      }
    </script>
    
    <!-- Tích hợp công cụ phân tích truy cập -->
    <script type="text/javascript">
        (function (c, l, a, r, i, t, y) {
            c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments) };
            t = l.createElement(r); t.async = 1; t.src = "https://www.clarity.ms/tag/" + i;
            y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
        })(window, document, "clarity", "script", "lhdpc5p7e1");
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XZ2TX9EEG7"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-XZ2TX9EEG7');
    </script>

    <!-- Tailwind CDN & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/logo.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Dancing+Script:wght@700&family=Geist:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&family=Syne:wght@700;800&family=Playfair+Display:ital,wght@0,700;1,600&family=Space+Grotesk:wght@700&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class', 
        theme: {
          extend: {
            fontFamily: {
              sans: ['Geist', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
              agustina: ['Agustina', 'cursive', 'sans-serif'],
              handwriting: ['Caveat', 'cursive'],
              script: ['Dancing Script', 'cursive'],
              instrument: ['Instrument Serif', 'serif'],
              syne: ['Syne', 'sans-serif'],
              jakarta: ['Plus Jakarta Sans', 'sans-serif'],
              serifDisplay: ['Playfair Display', 'serif'],
              space: ['Space Grotesk', 'sans-serif'],
              outfit: ['Outfit', 'sans-serif'],
            },
            colors: {
              accent: {
                DEFAULT: '#00F0FF',
                glow: 'rgba(0, 240, 255, 0.15)',
              },
              dark: {
                bg: '#09090b',
                surface: '#121215',
                card: '#18181b',
                border: 'rgba(255, 255, 255, 0.08)',
              },
              light: {
                bg: '#fafafa',
                surface: '#ffffff',
                card: '#f4f4f5',
                border: 'rgba(0, 0, 0, 0.08)',
              },
              telegram: '#30A3E6',
              facebook: '#0866FF',
              zalo: '#0068FF',
            }
          }
        }
      }
    </script>
    <style>
      @font-face {
        font-family: 'Agustina';
        src: url('/fonts/Agustina.woff') format('woff');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      /* Ẩn thanh cuộn nhưng vẫn hỗ trợ cuộn mượt */
      html {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      ::-webkit-scrollbar {
        display: none;
      }

      /* Logo Monogram Vector Styling */
      .icon-logo circle,
      .icon-logo path {
        fill: none !important;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .icon-logo circle {
        stroke-width: 10px;
      }

      .icon-logo path {
        stroke-width: 8px;
      }
    </style>
</head>
  <body class="bg-[#fafafa] text-zinc-900 dark:bg-[#09090b] dark:text-zinc-100 transition-colors duration-300 antialiased selection:bg-cyan-500/20 selection:text-cyan-600 dark:selection:text-cyan-300">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
