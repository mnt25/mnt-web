        try {
          var t = localStorage.getItem('theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.classList.add(t);
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

          }
        ]
      }

    <!-- Tích hợp công cụ phân tích truy cập (Clarity & Google Analytics) -->

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/logo.ico" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class', 
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],

            colors: {
              primary: '#3b82f6',
              telegram: '#30A3E6',

            }
          }
        }
      }

    <style>
      /* Ẩn thanh cuộn cho toàn bộ trang nhưng vẫn cho phép cuộn */
      html {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }
      ::-webkit-scrollbar {
        display: none;             /* Chrome, Safari, Opera */
      }

      /* Hiệu ứng vẽ liên tục và nhấp nháy phát sáng (neon breathe) cho Logo */
      .icon-logo circle,
      .icon-logo path {
        fill: none !important;
        stroke: #00d9ff;
        stroke-dasharray: 1000px;
        stroke-dashoffset: 1000px;
        animation: 
          logoContinuousDraw 12s cubic-bezier(0.4, 0, 0.2, 1) infinite,
          logoColorStroke 12s linear infinite,
          logoBreathe 3s ease-in-out infinite;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: stroke 350ms, stroke-width 350ms;
      }
 
      .icon-logo circle {
        /* Viền nét mảnh thanh lịch cho hình tròn ngoài */
        stroke-width: 10px;
      }
 
      .icon-logo path {
        /* Viền nét mảnh thanh lịch cho chữ P & S cách điệu bên trong */
        stroke-width: 8px;
      }

      @keyframes logoContinuousDraw {
        0% {
          stroke-dashoffset: 1000px;
        }
        10% {
          stroke-dashoffset: 0px;
        }
        90% {
          stroke-dashoffset: 0px;
        }
        100% {
          stroke-dashoffset: -1000px;
        }
      }

      @keyframes logoBreathe {
        0%, 100% {
          opacity: 0.65;
          filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.15));
        }
        50% {
          opacity: 1;
          filter: drop-shadow(0 0 10px currentColor);
        }
      }
      
      @keyframes logoColorStroke {
        0% { stroke: #00d9ff; }
        15% { stroke: #0077ff; }
        30% { stroke: #7700ff; }
        45% { stroke: #ff0077; }
        60% { stroke: #ff7700; }
        75% { stroke: #ffdd00; }
        90% { stroke: #00ff77; }
        100% { stroke: #00d9ff; }
      }

      @keyframes slideUpFade {
        0% {
          opacity: 0;
          transform: translateY(20px);
        }
        8%, 92% {
          opacity: 1;
          transform: translateY(0);
        }
        100% {
          opacity: 0;
          transform: translateY(-20px);
        }
      }

      .animate-slide-up-fade {
        animation: slideUpFade 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      /* Họa tiết đường phân tách sọc chéo cao cấp */
      .stripe-separator {
        position: relative;
        display: flex;
        height: 32px; /* h-8 */
        width: 100%;
        overflow: visible;
        pointer-events: none;
      }
      
      .stripe-separator::before {
        content: "";
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        top: 0;
        bottom: 0;
        width: 200vw;
        background: repeating-linear-gradient(
          315deg,
          #e2e8f0 0,
          #e2e8f0 1px,
          transparent 0,
          transparent 50%
        );
        background-size: 10px 10px;
        opacity: 0.8;
      }

      .dark .stripe-separator::before {
        background: repeating-linear-gradient(
          315deg,
          #27272a 0,
          #27272a 1px,
          transparent 0,
          transparent 50%
        );
        background-size: 10px 10px;
        opacity: 0.56;
      }

      /* Đường kẻ biên ngang ở trên và dưới của họa tiết sọc chéo */
      .stripe-separator::after {
        content: "";
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        top: 0;
        width: 200vw;
        height: 1px;
        background-color: rgba(226, 232, 240, 0.8);
      }

      .dark .stripe-separator::after {
        background-color: rgba(39, 39, 42, 0.8);
      }

      .stripe-separator-bottom {
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 200vw;
        height: 1px;
        background-color: rgba(226, 232, 240, 0.8);
      }

      .dark .stripe-separator-bottom {
        background-color: rgba(39, 39, 42, 0.8);
      }
    </style>
</head>
  <body class="bg-slate-50 text-slate-900 dark:bg-black dark:text-slate-50 transition-colors duration-300 overflow-x-hidden">
